<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Omosaa Bakery</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #1a1512; 
            font-family: 'Arial', sans-serif;
        }

        /* Container scales naturally with the image */
        .hero-container {
            position: relative;
            display: inline-block;
            width: 100%;
        }

        /* Displays the image at its natural, unconstrained size */
        .bg-image {
            width: 100%;
            height: auto;
            display: block;
        }

        /* The Dark Teal Navigation Button */
        .enter-btn {
            position: absolute;
            bottom: 20%; 
            right: 28%; 
            
            background-color: #1d3f3d; 
            color: #f4ebd9;            
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: bold;
            letter-spacing: 1px;
            padding: 10px 22px;
            border-radius: 20px;       
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
        }

        /* Hover Effect */
        .enter-btn:hover {
            background-color: #142d2b; 
            transform: translateY(-2px); 
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.4);
        }
    </style>
</head>
<body>

    <main class="hero-container">
        <img src="images/Bakery1.png" alt="Omosaa Bakery Background" class="bg-image">
        
        <a href="home.html" class="enter-btn">ENTER BAKERY</a>
    </main>

</body>
</html>
